<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitED — Every deadline, in orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#00E5FF;--vi:#A855F7;--gr:#39FF14;--am:#FFB547;--rd:#FF4D5E;--txt:#F5F7FF;--sub:#8B95A5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05060A;color:var(--txt);font-family:'Sora',sans-serif;overflow:hidden}
#stars{position:fixed;inset:0;z-index:1}
#grain{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:.05;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="2"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.55"/></svg>')}
#vignette{position:fixed;inset:0;z-index:11;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62) 100%)}
/* BOOT */
#boot{position:fixed;inset:0;background:#05060A;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.2s ease;cursor:pointer}
#boot.gone{opacity:0;pointer-events:none}
.b-eye{font-size:10px;letter-spacing:.5em;color:var(--sub);text-transform:uppercase;animation:bfade 1.2s ease .2s both}
#boot h1{font-family:'Space Grotesk';font-weight:300;font-size:64px;letter-spacing:.3em;margin-left:.3em;animation:bfade 1.4s ease .5s both}
#boot h1 span{color:var(--cy);font-weight:700}
.b-line{font-size:11px;letter-spacing:.6em;color:var(--cy);text-transform:uppercase;animation:bfade 1.4s ease 1.1s both}
.b-skip{position:absolute;bottom:30px;font-size:9px;letter-spacing:.3em;color:var(--sub)}
@keyframes bfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* LETTERBOX */
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;transition:height .9s cubic-bezier(.7,0,.3,1)}
#bar-t{top:0}#bar-b{bottom:0}
body.cinema .bar{height:11vh}
/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;transition:opacity .5s}
body.cinema header{opacity:0;pointer-events:none}
.h-logo{font-family:'Space Grotesk';font-size:15px;letter-spacing:.35em;font-weight:500}
.h-logo b{color:var(--cy)}
.h-school{font-size:9px;letter-spacing:.35em;color:var(--sub);margin-top:4px}
.roles{display:flex;gap:26px}
.role-btn{background:none;border:none;color:var(--sub);font-family:'Space Grotesk';font-size:10px;letter-spacing:.3em;cursor:pointer;padding:4px 0;border-bottom:1px solid transparent;transition:all .3s}
.role-btn:hover{color:var(--txt)}
.role-btn.active{color:var(--cy);border-bottom-color:var(--cy)}
/* UNIVERSE */
#stage{position:fixed;inset:0;z-index:5}
#universe{position:absolute;left:50%;top:50%;width:0;height:0;transition:transform 1.1s cubic-bezier(.7,0,.3,1),opacity .8s,filter .9s}
body.cinema #universe{transform:scale(1.5) translateY(4vh);opacity:.05;filter:blur(8px)}
.oring{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scaleY(.72);border:1px solid rgba(255,255,255,.045);border-radius:50%;pointer-events:none}
.planet{position:absolute;left:0;top:0;border-radius:50%;cursor:pointer;transition:filter .35s}
.planet:hover{filter:brightness(1.5)}
.planet.active{filter:brightness(1.6)}
.plabel{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);font-family:'Space Grotesk';font-weight:500;font-size:9px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 8px #000}
#core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:6}
.core-orb{width:74px;height:74px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff,var(--cy) 45%,#0a3b46 90%);box-shadow:0 0 60px rgba(0,229,255,.45),0 0 140px rgba(0,229,255,.18);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 60px rgba(0,229,255,.45),0 0 140px rgba(0,229,255,.18)}50%{box-shadow:0 0 80px rgba(0,229,255,.6),0 0 180px rgba(0,229,255,.25)}}
#core-label{font-family:'Space Grotesk';font-size:13px;letter-spacing:.4em;margin-top:16px;font-weight:500}
#core-sub{font-family:'Space Grotesk';font-weight:300;font-size:9px;letter-spacing:.25em;color:var(--sub);margin-top:5px;text-transform:uppercase}
/* HINT + TICKER */
#hint{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:20;font-family:'Space Grotesk';font-size:10px;letter-spacing:.4em;color:var(--sub);text-transform:uppercase;transition:opacity .5s;animation:hintpulse 2.6s ease-in-out infinite}
@keyframes hintpulse{0%,100%{opacity:.4}50%{opacity:.9}}
body.cinema #hint{opacity:0}
#ticker-wrap{position:fixed;bottom:0;left:0;right:0;padding:11px 0;border-top:1px solid rgba(255,255,255,.06);background:rgba(5,6,10,.72);backdrop-filter:blur(8px);overflow:hidden;z-index:20;transition:transform .9s cubic-bezier(.7,0,.3,1)}
body.cinema #ticker-wrap{transform:translateY(110%)}
#ticker{display:inline-block;white-space:nowrap;font-family:'Space Grotesk';font-weight:300;font-size:9px;letter-spacing:.3em;color:var(--sub);text-transform:uppercase;animation:tick 55s linear infinite}
@keyframes tick{from{transform:translateX(60vw)}to{transform:translateX(-110%)}}
#stamp{position:fixed;bottom:38px;left:30px;z-index:19;font-family:'Space Grotesk';font-weight:300;font-size:8px;letter-spacing:.3em;color:var(--sub);transition:opacity .5s}
body.cinema #stamp{opacity:0}
/* DETAIL */
#detail{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease;padding:0 20px}
#detail.show{opacity:1;pointer-events:auto}
#detail .d-inner>*{opacity:0;transition:opacity .3s ease,transform .3s ease,filter .3s ease}
#detail.show .d-inner>*{animation:dIn .75s cubic-bezier(.16,1,.3,1) both}
#detail.show .d-inner>*:nth-child(1){animation-delay:.04s}
#detail.show .d-inner>*:nth-child(2){animation-delay:.10s}
#detail.show .d-inner>*:nth-child(3){animation-delay:.16s}
#detail.show .d-inner>*:nth-child(4){animation-delay:.22s}
#detail.show .d-inner>*:nth-child(5){animation-delay:.28s}
#detail.show .d-inner>*:nth-child(6){animation-delay:.34s}
@keyframes dIn{from{opacity:0;transform:translateY(26px);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.d-inner{width:min(600px,94vw);max-height:72vh;overflow-y:auto}
.d-eyebrow{font-family:'Space Grotesk';font-weight:500;font-size:10px;letter-spacing:.5em;color:var(--cy);text-transform:uppercase;margin-bottom:18px}
#d-title{font-family:'Space Grotesk';font-weight:300;font-size:52px;letter-spacing:.12em;line-height:1.05;margin-bottom:10px}
.d-meta{font-family:'Space Grotesk';font-weight:300;font-size:12px;color:var(--sub);letter-spacing:.2em;margin-bottom:22px;text-transform:uppercase}
.d-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{font-family:'Space Grotesk';font-weight:500;font-size:9px;letter-spacing:.2em;padding:6px 12px;border-radius:999px;border:1px solid;text-transform:uppercase}
.chip.g{color:var(--cy);border-color:rgba(0,229,255,.35);background:rgba(0,229,255,.07)}
.chip.ok{color:var(--gr);border-color:rgba(57,255,20,.3);background:rgba(57,255,20,.06)}
.chip.p{color:var(--am);border-color:rgba(255,181,71,.35);background:rgba(255,181,71,.07)}
.chip.d{color:var(--rd);border-color:rgba(255,77,94,.35);background:rgba(255,77,94,.07)}
.d-rows{display:flex;flex-direction:column;gap:9px;margin-bottom:30px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.02);backdrop-filter:blur(6px)}
.drow .t{font-family:'Space Grotesk';font-weight:500;font-size:13px;letter-spacing:.04em}
.drow .s{font-family:'Space Grotesk';font-weight:300;font-size:10px;color:var(--sub);margin-top:4px;letter-spacing:.18em;text-transform:uppercase}
#d-back{background:none;border:1px solid rgba(255,255,255,.2);color:var(--txt);font-family:'Space Grotesk';font-weight:500;font-size:10px;letter-spacing:.35em;padding:13px 26px;border-radius:999px;cursor:pointer;transition:all .3s;text-transform:uppercase}
#d-back:hover{border-color:var(--cy);color:var(--cy);box-shadow:0 0 24px rgba(0,229,255,.15)}
@media(max-width:700px){#d-title{font-size:34px}.roles{gap:14px}.role-btn{font-size:8px;letter-spacing:.2em}#boot h1{font-size:40px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="grain"></div>
<div id="vignette"></div>

<div id="boot" onclick="this.classList.add('gone')">
  <div class="b-eye">Rise Institute presents</div>
  <h1>ORBIT<span>ED</span></h1>
  <div class="b-line">Every deadline, in orbit</div>
  <div class="b-skip">Click to skip</div>
</div>

<div id="bar-t" class="bar"></div>
<div id="bar-b" class="bar"></div>

<header>
  <div><div class="h-logo">ORBIT<b>ED</b></div><div class="h-school">RISE INSTITUTE · QUARTER 2</div></div>
  <nav class="roles">
    <button class="role-btn active" data-r="student" onclick="setRole('student')">STUDENT</button>
    <button class="role-btn" data-r="teacher" onclick="setRole('teacher')">TEACHER</button>
    <button class="role-btn" data-r="admin" onclick="setRole('admin')">ADMIN</button>
  </nav>
</header>

<div id="stage"><div id="universe">
  <div id="core"><div class="core-orb"></div><div id="core-label">YOU</div><div id="core-sub">Grade 8 · Quarter 2</div></div>
</div></div>

<div id="hint">Select a planet</div>
<div id="ticker-wrap"><div id="ticker"></div></div>
<div id="stamp">ORBITED DEMO · SAMPLE DATA · BUILT BY SAMIR</div>

<div id="detail">
  <div class="d-inner">
    <div class="d-eyebrow" id="d-eyebrow"></div>
    <h2 id="d-title"></h2>
    <div class="d-meta" id="d-meta"></div>
    <div class="d-chips" id="d-chips"></div>
    <div class="d-rows" id="d-rows"></div>
    <button id="d-back" onclick="exitPlanet()">&#8592; Return to orbit</button>
  </div>
</div>

<script>
const DATA={
 student:{file:'Class file',core:['YOU','Grade 8 · Quarter 2'],
  ticker:['Due tomorrow — Unit 3 Performance Task · Math','Nov 3 — Research Log · English','Oct 31 — Weekly Readings · Science','Nov 5 — Islamic Studies Reflection'],
  planets:[
   {name:'Mathematics',color:'#00E5FF',meta:'Mariam Mehdi · Period 3',chips:[['GRADE 89%','g'],['1 PENDING','p'],['5/6 SUBMITTED','ok']],
    rows:[['Unit 3 Performance Task','Due Nov 2','PENDING','p'],['Geometry Worksheet 4','Returned · 92/100','GRADED','ok'],['Fractions Set B','Due Oct 18','SUBMITTED','ok']]},
   {name:'English',color:'#A855F7',meta:'Tehreem Fatima · Period 1',chips:[['GRADE 84%','g'],['3 PENDING','p'],['2/5 SUBMITTED','d']],
    rows:[['Research Log — Brochure','Due Nov 3','PENDING','p'],['Brochure Project','Due Nov 10','PENDING','p'],['Poetry Response','Returned · 88/100','GRADED','ok']]},
   {name:'Science',color:'#39FF14',meta:'Ayesha Khan · Period 5',chips:[['GRADE 91%','g'],['1 DUE SOON','p'],['4/5 SUBMITTED','ok']],
    rows:[['Weekly Readings — CK12','Due Oct 31','DUE TOMORROW','d'],['Lab Report — Cells','Returned · 95/100','GRADED','ok'],['Section Quiz 4','Due Oct 24','SUBMITTED','ok']]},
   {name:'Islamic Studies',color:'#FFB547',meta:'Asma Baqri · Period 2',chips:[['GRADE 88%','g'],['ALL CAUGHT UP','ok']],
    rows:[['Reflection — Surah Al-Fil','Due Nov 5','PENDING','p'],['Pillars of Islam Quiz','Returned · 90/100','GRADED','ok']]},
   {name:'Social Studies',color:'#FF4D5E',meta:'Omar Farooq · Period 4',chips:[['GRADE 82%','g'],['2 PENDING','p']],
    rows:[['Essay Outline — Civilizations','Due Nov 4','PENDING','p'],['Map Analysis Worksheet','Due Oct 29','SUBMITTED','ok']]},
   {name:'Computer Science',color:'#60A5FA',meta:'Bilal Raza · Period 6',chips:[['GRADE 94%','g'],['ALL CAUGHT UP','ok']],
    rows:[['Recursion Problem Set','Due Nov 7','PENDING','p'],['Loops Lab','Returned · 96/100','GRADED','ok']]}
  ]},
 teacher:{file:'Section file',core:['M. MEHDI','Teacher · Mathematics'],
  ticker:['To grade: 12 submissions','Missing work flagged: 5 students','Unit 3 Performance Task closes Nov 2','Staff meeting — Wednesday 14:00'],
  planets:[
   {name:'Math · Period 3',color:'#00E5FF',meta:'28 students · Room 204',chips:[['7 TO GRADE','p'],['2 MISSING','d'],['AVG 86%','ok']],
    rows:[['Unit 3 Performance Task','7 of 28 submitted','TO GRADE','p'],['Geometry Worksheet 4','28 of 28 · returned','DONE','ok'],['Fractions Set B','26 of 28 · returned','2 MISSING','d']]},
   {name:'Math · Period 4',color:'#A855F7',meta:'26 students · Room 204',chips:[['ALL GRADED','ok'],['AVG 84%','ok']],
    rows:[['Geometry Worksheet 4','26 of 26 · returned','DONE','ok'],['Fractions Set B','26 of 26 · returned','DONE','ok']]},
   {name:'Math · Period 6',color:'#39FF14',meta:'24 students · Room 209',chips:[['5 TO GRADE','p'],['3 MISSING','d'],['AVG 88%','ok']],
    rows:[['Unit 3 Performance Task','5 of 24 submitted','TO GRADE','p'],['Fractions Set B','21 of 24 · returned','3 MISSING','d']]}
  ]},
 admin:{file:'Department file',core:['RISE INSTITUTE','Administrator · Quarter 2'],
  ticker:['Logins today: 367','Submissions this week: 1,248','Overdue work: 54','New enrollments Q2: +9','3 teacher accounts pending approval'],
  planets:[
   {name:'Mathematics',color:'#00E5FF',meta:'4 teachers · Grades 6–8',chips:[['82 STUDENTS','g'],['AVG 81%','ok'],['9 OVERDUE','d']],
    rows:[['Students enrolled','82','','g'],['Teachers','4','','g'],['Department average','81%','','ok'],['Overdue assignments','9 items','ATTENTION','d']]},
   {name:'English',color:'#A855F7',meta:'4 teachers · Grades 6–8',chips:[['78 STUDENTS','g'],['AVG 83%','ok'],['7 OVERDUE','d']],
    rows:[['Students enrolled','78','','g'],['Teachers','4','','g'],['Department average','83%','','ok'],['Overdue assignments','7 items','ATTENTION','d']]},
   {name:'Science',color:'#39FF14',meta:'3 teachers · Grades 6–8',chips:[['84 STUDENTS','g'],['AVG 79%','p'],['11 OVERDUE','d']],
    rows:[['Students enrolled','84','','g'],['Teachers','3','','g'],['Department average','79%','WATCH','p'],['Overdue assignments','11 items','ATTENTION','d']]},
   {name:'Islamic Studies',color:'#FFB547',meta:'3 teachers · Grades 6–8',chips:[['80 STUDENTS','g'],['AVG 88%','ok'],['2 OVERDUE','d']],
    rows:[['Students enrolled','80','','g'],['Teachers','3','','g'],['Department average','88%','','ok'],['Overdue assignments','2 items','ATTENTION','d']]},
   {name:'Computer Science',color:'#60A5FA',meta:'2 teachers · Grades 7–8',chips:[['46 STUDENTS','g'],['AVG 90%','ok'],['0 OVERDUE','ok']],
    rows:[['Students enrolled','46','','g'],['Teachers','2','','g'],['Department average','90%','','ok'],['Overdue assignments','0','','ok']]}
  ]}
};
let role='student',planets=[],mx=0,my=0,t=0;
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let stars=[];
function initStars(){cv.width=innerWidth;cv.height=innerHeight;stars=[];for(let i=0;i<230;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.3,s:Math.random()*.06+.015,o:Math.random()*.65+.15});}
function drawStars(){cx.clearRect(0,0,cv.width,cv.height);const g=cx;stars.forEach(s=>{s.y+=s.s;if(s.y>cv.height)s.y=0;g.globalAlpha=s.o;g.fillStyle='#9fb4d8';g.beginPath();g.arc(s.x+mx*22*(s.r),s.y,s.r,0,7);g.fill();});g.globalAlpha=1;}
addEventListener('resize',()=>{initStars();buildUniverse();});
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
function buildUniverse(){
 const u=document.getElementById('universe');
 u.querySelectorAll('.planet,.oring').forEach(n=>n.remove());
 const d=DATA[role];
 document.getElementById('core-label').textContent=d.core[0];
 document.getElementById('core-sub').textContent=d.core[1];
 document.getElementById('ticker').textContent=d.ticker.join('   ·   ');
 const base=Math.min(innerWidth,innerHeight);
 const rings=[base*.17,base*.33];
 const made={};planets=d.planets.map((p,i)=>{
  const ring=d.planets.length>3?i%2:0;const rad=rings[ring];
  if(!made[ring]){made[ring]=1;const r=document.createElement('div');r.className='oring';r.style.width=r.style.height=rad*2+'px';u.appendChild(r);}
  const el=document.createElement('div');el.className='planet';
  const size=(ring?52:40)+(i%3)*7;
  el.style.width=el.style.height=size+'px';
  el.style.background='radial-gradient(circle at 32% 30%,'+p.color+',#05060a 78%)';
  el.style.boxShadow='0 0 34px '+p.color+'44, inset -10px -12px 26px rgba(0,0,0,.85)';
  el.innerHTML='<div class="plabel" style="color:'+p.color+'">'+p.name+'</div>';
  const idx=i;el.onclick=()=>enterPlanet(p,ring,idx);
  u.appendChild(el);
  return{el,rad,ang:(i/d.planets.length)*Math.PI*2+ring*.5,speed:(ring?.0016:.0024)+i*.00018};
 });
}
function enterPlanet(p,ring,idx){
 const d=DATA[role];
 document.getElementById('d-eyebrow').textContent=d.file+' // '+String(idx+1).padStart(2,'0');
 document.getElementById('d-title').textContent=p.name;
 document.getElementById('d-meta').textContent=p.meta;
 document.getElementById('d-chips').innerHTML=p.chips.map(c=>'<span class="chip '+c[1]+'">'+c[0]+'</span>').join('');
 document.getElementById('d-rows').innerHTML=p.rows.map(r=>'<div class="drow"><div><div class="t">'+r[0]+'</div>'+(r[1]?'<div class="s">'+r[1]+'</div>':'')+'</div>'+(r[2]?'<span class="chip '+r[3]+'">'+r[2]+'</span>':'')+'</div>').join('');
 document.body.classList.add('cinema');
 document.querySelectorAll('.planet').forEach(n=>n.classList.remove('active'));
 planets[idx].el.classList.add('active');
 setTimeout(()=>document.getElementById('detail').classList.add('show'),200);
}
function exitPlanet(){document.getElementById('detail').classList.remove('show');document.querySelectorAll('.planet.active').forEach(n=>n.classList.remove('active'));document.body.classList.remove('cinema');}
function setRole(r){
 if(role===r)return;
 role=r;
 document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.r===r));
 if(document.body.classList.contains('cinema'))exitPlanet();
 const u=document.getElementById('universe');u.style.opacity=0;u.style.filter='blur(6px)';
 setTimeout(()=>{buildUniverse();u.style.opacity=1;u.style.filter='none';},420);
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('cinema'))exitPlanet();});
function loop(){
 t+=.01;
 planets.forEach((p,i)=>{
  p.ang+=p.speed;
  const w=Math.sin(t+i)*2.5;
  const x=Math.cos(p.ang)*p.rad+mx*18;
  const y=Math.sin(p.ang)*p.rad*.72+my*12+w;
  p.el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px)';
 });
 drawStars();requestAnimationFrame(loop);
}
initStars();buildUniverse();loop();
setTimeout(()=>document.getElementById('boot').classList.add('gone'),2800);
</script>
</body>
</html>
